[project]
name = "tool-to-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vrushabh Damle", email = "dwrushabh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.0",
    "langchain-core>=1.6.9",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.7.0",
    "mcp>=2.3.0",
    "pathlib>=1.0.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tool-to-tool = "tool_to_tool:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
